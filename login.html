<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login - Crust & Co</title>
    <meta name="description" content="Sign in to your Crust & Co customer account to track orders and view order history." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS (Instant standalone engine - renders fully in Live Server, cPanel, or local browser) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'crust-green': '#12372a',
              'crust-green-mid': '#1f4d3a',
              'crust-cream': '#f8f6f0',
              'crust-gold': '#d4a72c',
              'crust-text': '#1c1c1c',
              'crust-muted': '#6b6b6b',
              'crust-border': '#e8e5dc',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-[#F8F6F0] text-[#1C1C1C] flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-[#F8F6F0]/95 backdrop-blur-md border-b border-[#E8E5DC]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-8">
        <a href="./index.html" class="text-2xl sm:text-3xl font-serif font-bold text-[#12372A] tracking-tight whitespace-nowrap shrink-0 hover:opacity-90 transition-opacity">
          Crust & Co
        </a>

        <div class="flex items-center gap-4">
          <a href="./index.html" class="text-xs font-semibold text-[#12372A] hover:underline">
            Return to Home
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6">
      <div class="max-w-md w-full bg-white rounded-2xl border border-[#E8E5DC] p-8 shadow-sm space-y-6">
        <div class="text-center">
          <span class="text-xs uppercase font-semibold text-[#D4A72C] tracking-widest">Customer Area</span>
          <h1 class="text-2xl sm:text-3xl font-serif font-bold text-[#12372A] mt-1">Sign In</h1>
          <p class="text-xs text-[#6B6B6B] mt-1">Access your active orders and dining history.</p>
        </div>

        <!-- 1-Click Demo Fill -->
        <div class="p-3 bg-[#F8F6F0] rounded-xl border border-[#E8E5DC] flex items-center justify-between text-xs">
          <div>
            <div class="font-semibold text-[#12372A]">Demo Account</div>
            <div class="text-[#6B6B6B] text-[11px]">hamza@crustco.pk</div>
          </div>
          <button id="fill-demo-btn" type="button" class="px-3 py-1.5 bg-[#12372A] text-white font-medium rounded-md hover:bg-[#1F4D3A] text-xs">
            Auto Fill
          </button>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="ident" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Email or Phone Number <span class="text-rose-500">*</span>
            </label>
            <input
              type="text"
              id="ident"
              required
              placeholder="e.g. hamza@crustco.pk or 03001234567"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Password <span class="text-rose-500">*</span>
            </label>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div id="error-msg" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 p-3 rounded-lg"></div>

          <button
            type="submit"
            class="w-full py-3.5 bg-[#12372A] hover:bg-[#1F4D3A] text-white text-xs sm:text-sm font-semibold rounded-lg transition-colors shadow-sm"
          >
            Log In
          </button>
        </form>

        <div class="text-center pt-2 border-t border-[#E8E5DC] text-xs text-[#6B6B6B]">
          Don't have a customer profile? 
          <a href="/signup.html" class="text-[#12372A] font-semibold underline ml-1">Create Account</a>
        </div>
      </div>
    </main>

    <!-- Global Footer -->
    <footer class="bg-[#12372A] text-white border-t border-[#1F4D3A] py-6 text-center text-xs text-white/60">
      © 2026 Crust & Co. Prototype Authentication.
    </footer>

    <!-- App Scripts -->
    <script type="module" src="./js/app.js"></script>
    <script type="module">
      import { login } from './js/auth.js';
      import { showToast } from './js/ui.js';

      const form = document.getElementById('login-form');
      const identInput = document.getElementById('ident');
      const passInput = document.getElementById('password');
      const errorDiv = document.getElementById('error-msg');
      const demoBtn = document.getElementById('fill-demo-btn');

      if (demoBtn) {
        demoBtn.onclick = () => {
          identInput.value = 'hamza@crustco.pk';
          passInput.value = 'password123';
        };
      }

      form.onsubmit = (e) => {
        e.preventDefault();
        errorDiv.classList.add('hidden');

        try {
          const user = login(identInput.value, passInput.value);
          showToast(`Welcome back, ${user.name}!`);
          setTimeout(() => {
            window.location.href = './account.html';
          }, 400);
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.classList.remove('hidden');
        }
      };
    </script>
  </body>
</html>
