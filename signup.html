<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Signup - Crust & Co</title>
    <meta name="description" content="Create a Crust & Co customer profile for faster food ordering and tracking." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-[#F8F6F0] text-[#1C1C1C] flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-[#F8F6F0]/95 backdrop-blur-md border-b border-[#E8E5DC]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-8">
        <a href="/index.html" class="text-2xl sm:text-3xl font-serif font-bold text-[#12372A] tracking-tight whitespace-nowrap shrink-0">
          Crust & Co
        </a>

        <div class="flex items-center gap-4">
          <a href="/index.html" class="text-xs font-semibold text-[#12372A] hover:underline">
            Return to Home
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6">
      <div class="max-w-md w-full bg-white rounded-2xl border border-[#E8E5DC] p-8 shadow-sm space-y-6">
        <div class="text-center">
          <span class="text-xs uppercase font-semibold text-[#D4A72C] tracking-widest">Join Crust & Co</span>
          <h1 class="text-2xl sm:text-3xl font-serif font-bold text-[#12372A] mt-1">Create Account</h1>
          <p class="text-xs text-[#6B6B6B] mt-1">Faster checkout, saved addresses, and active order tracking.</p>
        </div>

        <form id="signup-form" class="space-y-4">
          <div>
            <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Full Name <span class="text-rose-500">*</span>
            </label>
            <input
              type="text"
              id="name"
              required
              placeholder="e.g. Ayesha Khan"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div>
            <label for="phone" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Phone Number <span class="text-rose-500">*</span>
            </label>
            <input
              type="tel"
              id="phone"
              required
              placeholder="e.g. 0300 1234567"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Email Address <span class="text-rose-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              required
              placeholder="e.g. ayesha@gmail.com"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Create Password <span class="text-rose-500">*</span>
            </label>
            <input
              type="password"
              id="password"
              required
              placeholder="At least 6 characters"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div>
            <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-[#12372A] mb-1.5">
              Confirm Password <span class="text-rose-500">*</span>
            </label>
            <input
              type="password"
              id="confirm-password"
              required
              placeholder="Re-enter password"
              class="w-full text-xs sm:text-sm p-3 rounded-lg border border-[#E8E5DC] focus:outline-hidden focus:border-[#12372A]"
            />
          </div>

          <div id="error-msg" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 p-3 rounded-lg"></div>

          <button
            type="submit"
            class="w-full py-3.5 bg-[#12372A] hover:bg-[#1F4D3A] text-white text-xs sm:text-sm font-semibold rounded-lg transition-colors shadow-sm"
          >
            Create Customer Account
          </button>
        </form>

        <div class="text-center pt-2 border-t border-[#E8E5DC] text-xs text-[#6B6B6B]">
          Already have an account? 
          <a href="/login.html" class="text-[#12372A] font-semibold underline ml-1">Sign In</a>
        </div>
      </div>
    </main>

    <!-- Global Footer -->
    <footer class="bg-[#12372A] text-white border-t border-[#1F4D3A] py-6 text-center text-xs text-white/60">
      © 2026 Crust & Co. Prototype Authentication.
    </footer>

    <!-- App Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { signup } from '/js/auth.js';
      import { showToast } from '/js/ui.js';

      const form = document.getElementById('signup-form');
      const nameInput = document.getElementById('name');
      const phoneInput = document.getElementById('phone');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm-password');
      const errorDiv = document.getElementById('error-msg');

      form.onsubmit = (e) => {
        e.preventDefault();
        errorDiv.classList.add('hidden');

        if (passInput.value.length < 6) {
          errorDiv.textContent = 'Password must be at least 6 characters.';
          errorDiv.classList.remove('hidden');
          return;
        }

        if (passInput.value !== confirmInput.value) {
          errorDiv.textContent = 'Passwords do not match.';
          errorDiv.classList.remove('hidden');
          return;
        }

        try {
          const user = signup({
            name: nameInput.value,
            phone: phoneInput.value,
            email: emailInput.value,
            password: passInput.value,
          });
          showToast(`Account created! Welcome, ${user.name}`);
          setTimeout(() => {
            window.location.href = '/account.html';
          }, 400);
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.classList.remove('hidden');
        }
      };
    </script>
  </body>
</html>
